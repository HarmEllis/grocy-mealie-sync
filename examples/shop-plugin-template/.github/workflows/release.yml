name: Publish release image
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      packages: write
    steps:
      - name: Resolve tag
        id: ref
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Invalid release tag' >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ steps.ref.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - name: Validate version and compute safe image tags
        id: plan
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        run: node scripts/release-plan.mjs "$TAG" "$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"
      - name: Require successful CI on the exact tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          count="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&status=completed&per_page=100" | jq --arg sha "$sha" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | length')"
          test "$count" -gt 0 || { echo 'CI must succeed on the exact tagged commit before publication.' >&2; exit 1; }
          if [ "$PRERELEASE" = false ]; then
            status="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$sha" --jq '.status')"
            case "$status" in identical|behind) ;; *) echo 'Stable releases must be on main.' >&2; exit 1 ;; esac
          fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.plan.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: false
          sbom: false
      - name: Create a draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ref.outputs.tag }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
        run: |
          args=(--draft --latest=false)
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --generate-notes "${args[@]}"
          fi
